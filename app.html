<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AniList 追番清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts 异步加载（media=print 交换法）：该域国内访问不稳定，
       绝不能阻塞首屏渲染——系统字体栈先兜底，字体就绪后自动换装 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Zen+Dots&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Zen+Dots&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Zen+Dots&display=swap"></noscript>
  <!-- Font Awesome 本地自托管：cdnjs 实测阻塞 1.4~12s，渲染阻塞资源必须同源 -->
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=18">
  <!-- 数据预取：脚本还在下载时就把三路云端请求发出去，
       DOMContentLoaded 后由 js/storage.js 直接复用，省掉「等资源下载完再发请求」的串行等待。
       私有仓库需要 Token，这里从 localStorage 读一次；未配置时匿名请求会在 404 时被忽略。 -->
  <script>
    (function () {
      var repo = 'WMX778899/jiju';
      var token = '';
      try {
        var cfg = JSON.parse(localStorage.getItem('anilist_github_config') || 'null');
        token = (cfg && cfg.token) || '';
      } catch (e) { /* 无配置 */ }
      var headers = token ? { Authorization: 'Bearer ' + token } : {};
      var opts = { cache: 'no-cache' };
      window.__prefetch = {
        repo: repo,
        api: fetch('https://api.github.com/repos/' + repo + '/contents/data.json', { cache: 'no-cache', headers: headers }),
        raw: fetch('https://raw.githubusercontent.com/' + repo + '/main/data.json', opts),
        jsdelivr: fetch('https://cdn.jsdelivr.net/gh/' + repo + '@main/data.json', opts),
      };
    })();
  </script>
  <!-- 首屏内联样式：必须在外部样式表之外先落地，
       否则环境光 / 顶部加载条的入场会等 CSS 到达才开始 -->
  <style>
    /* 打开页面时的一次性环境光 + 顶部加载条。
       数据就位后由 js/app.js 给 <html> 加 .app-ready，两者一起淡出。 */
    .boot-bloom {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse 62% 46% at 50% 8%, rgba(var(--accent-rgb), 0.18), transparent 70%),
        radial-gradient(ellipse 78% 52% at 50% 104%, rgba(var(--accent-deep-rgb), 0.14), transparent 74%);
      animation: bootBloomIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: opacity 0.6s ease;
    }
    html.app-ready .boot-bloom { opacity: 0; }

    @keyframes bootBloomIn {
      from { opacity: 0; transform: scale(1.06); }
      55%  { opacity: 1; }
      to   { opacity: 0.72; transform: scale(1); }
    }

    .boot-line {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 500;
      pointer-events: none;
      background-image: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.92), rgba(var(--accent-base-pink-rgb), 0.7), transparent);
      background-size: 42% 100%;
      background-repeat: no-repeat;
      animation: bootLineRun 1.15s ease-in-out infinite;
      transition: opacity 0.45s ease;
    }
    html.app-ready .boot-line { opacity: 0; }

    @keyframes bootLineRun {
      0%   { background-position: -42% 0; }
      100% { background-position: 142% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-bloom, .boot-line { animation: none; }
      html.app-ready .boot-bloom, html.app-ready .boot-line { display: none; }
    }
  </style>
</head>
<body class="theme-blue">

  <!-- ===== 权限验证（未通过密码则跳回门禁） ===== -->
  <script>
    if (sessionStorage.getItem('anilist_gate_passed') !== '1') {
      window.location.replace('index.html');
    }
  </script>

  <!-- ===== 首屏点缀：环境光 + 顶部加载条（加 .app-ready 后淡出） ===== -->
  <div class="boot-bloom" aria-hidden="true"></div>
  <div class="boot-line" aria-hidden="true"></div>

  <!-- ===== 背景粒子画布 ===== -->
  <canvas id="particleCanvas"></canvas>

  <!-- ===== 主容器 ===== -->
  <div class="app-container">

    <!-- ===== 头部 ===== -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-brand">
          <span class="header-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          <h1 class="header-title">AniList</h1>
          <span class="header-subtitle">追番清单</span>
        </div>
        <div class="header-actions">
          <div class="sync-status" id="syncStatus" title="数据同步状态">
            <i class="fa-solid fa-cloud"></i>
            <span id="syncText">本地</span>
          </div>
          <button class="header-btn" id="githubBtn" title="GitHub 云同步">
            <i class="fa-brands fa-github"></i>
          </button>
        </div>
      </div>
    </header>

    <section class="filter-bar">
      <div class="filter-group">
        <!-- 三个筛选：原生 select 保留为唯一数据源（value / change 事件不变），
             视觉由 js/filter-dropdown.js 生成的按钮 + 动画面板接管 -->
        <div class="filter-select-wrapper">
          <select id="typeFilter" class="filter-select" data-fd-icon="fa-solid fa-shapes" aria-label="按类型筛选">
            <option value="all">全部类型</option>
            <option value="anime">动画</option>
            <option value="drama">剧集</option>
            <option value="movie">电影</option>
          </select>
        </div>
        <div class="filter-select-wrapper">
          <select id="statusFilter" class="filter-select" data-fd-icon="fa-solid fa-signal" aria-label="按状态筛选">
            <option value="all">全部状态</option>
            <option value="watching">在看</option>
            <option value="want_to_watch">想看</option>
            <option value="completed">看完</option>
          </select>
        </div>
        <div class="filter-select-wrapper">
          <select id="sortSelect" class="filter-select" data-fd-icon="fa-solid fa-arrow-down-wide-short" aria-label="排序方式">
            <option value="default" selected>默认排序</option>
            <option value="newest">时间降序</option>
            <option value="oldest">时间升序</option>
            <option value="title">名称升序</option>
            <option value="title-desc">名称降序</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ===== 统计栏 ===== -->
    <section class="stats-bar" id="statsBar">
      <div class="stat-item" data-status="want_to_watch">
        <span class="stat-count" id="statWant">0</span>
        <span class="stat-label"><i class="fa-regular fa-clock"></i> 想看</span>
      </div>
      <div class="stat-item" data-status="watching">
        <span class="stat-count" id="statWatching">0</span>
        <span class="stat-label"><i class="fa-solid fa-play"></i> 在看</span>
      </div>
      <div class="stat-item" data-status="completed">
        <span class="stat-count" id="statCompleted">0</span>
        <span class="stat-label"><i class="fa-solid fa-check"></i> 看完</span>
      </div>
    </section>

    <!-- ===== 搜索 ===== -->
    <div class="search-row" id="searchRow">
      <div class="stat-search-wrap">
        <input type="text" class="stat-search" id="globalSearch" placeholder="搜索番剧...">
        <i class="fa-solid fa-search"></i>
      </div>
    </div>

    <!-- ===== 列表区 ===== -->
    <main class="list-container" id="listContainer">
      <!-- 骨架屏：云端数据返回前兜住空白，render() 会用真实卡片整体替换 -->
      <div class="boot-skeleton" id="bootSkeleton" aria-hidden="true">
        <div class="boot-skel-card" style="--skel-i: 0"></div>
        <div class="boot-skel-card" style="--skel-i: 1"></div>
        <div class="boot-skel-card" style="--skel-i: 2"></div>
        <div class="boot-skel-card" style="--skel-i: 3"></div>
        <div class="boot-skel-card" style="--skel-i: 4"></div>
        <div class="boot-skel-card" style="--skel-i: 5"></div>
      </div>
    </main>

    <!-- ===== 空状态 ===== -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon"><i class="fa-solid fa-list"></i></div>
      <p class="empty-text" id="emptyText">还没有记录，点 + 添加吧</p>
    </div>

  </div>

  <!-- ===== 浮动添加按钮 ===== -->
  <button class="fab" id="fabAdd" title="添加番剧">
    <i class="fas fa-plus"></i>
  </button>

  <!-- ===== 模态框（添加 / 编辑） ===== -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">添加番剧</h2>
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      </div>
      <form class="anime-form" id="animeForm">
        <input type="hidden" id="formId">

        <div class="form-group">
          <label class="form-label" for="formTitle">名称</label>
          <input type="text" id="formTitle" class="form-input" placeholder="输入名称..." required maxlength="100">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="formType">类型</label>
            <div class="form-select-wrapper">
              <select id="formType" class="form-select" data-fd-icon="fa-solid fa-shapes">
                <option value="anime">动画</option>
                <option value="drama">剧集</option>
                <option value="movie">电影</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="formStatus">状态</label>
            <div class="form-select-wrapper">
              <select id="formStatus" class="form-select" data-fd-icon="fa-solid fa-signal">
                <option value="watching">在看</option>
                <option value="want_to_watch" selected>想看</option>
                <option value="completed">看完</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="formCancel">取消</button>
          <button type="submit" class="btn btn-submit" id="formSubmit">
            <i class="fas fa-check"></i> 保存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== 删除确认弹窗 ===== -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2 class="modal-title">确认删除</h2>
        <button class="modal-close" id="deleteClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="delete-body">
        <div class="delete-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <p class="delete-text">确定要删除 <strong id="deleteTitle">此条目</strong> 吗？</p>
        <p class="delete-hint">此操作可撤销，10 秒内有效</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" id="deleteCancel">取消</button>
        <button type="button" class="btn btn-danger" id="deleteConfirm">
          <i class="fas fa-trash"></i> 删除
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Toast 消息 ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== GitHub 同步配置弹窗 ===== -->
  <div class="modal-overlay" id="githubModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title"><i class="fa-brands fa-github"></i> GitHub 云同步</h2>
        <button class="modal-close" id="githubClose"><i class="fas fa-times"></i></button>
      </div>
      <form class="anime-form" id="githubForm">
        <div class="form-group">
          <label class="form-label">Personal Access Token</label>
          <input type="password" id="githubToken" class="form-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" maxlength="100">
          <span class="form-hint">
            需要 <code>public_repo</code> 权限 ·
            <a href="https://github.com/settings/tokens" target="_blank">去创建 →</a>
          </span>
        </div>
        <div class="form-group">
          <label class="form-label">仓库 (owner/repo)</label>
          <input type="text" id="githubRepo" class="form-input" placeholder="WMX778899/jiju" maxlength="100">
        </div>

        <div class="github-actions">
          <button type="button" class="btn btn-submit" id="githubPushBtn">
            <i class="fa-solid fa-upload"></i> 上传到云端
          </button>
          <button type="button" class="btn btn-cancel" id="githubPullBtn">
            <i class="fa-solid fa-download"></i> 从云端下载
          </button>
        </div>

        <div id="githubStatus" class="github-status"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="githubCancel">关闭</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== JS ===== -->
  <script>
    // ==== GitHub 同步配置（所有设备共用）====
    const GITHUB_DEFAULT_REPO = 'WMX778899/jiju';
    // Token 由用户在弹窗中手动填写，保存在 localStorage
  </script>
  <script src="js/particles.js?v=6"></script>
  <script src="js/storage.js?v=8"></script>
  <script src="js/app.js?v=17"></script>
  <script src="js/filter-dropdown.js?v=2"></script>
</body>
</html>
